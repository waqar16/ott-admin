<svg width="100%" height="100%" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="400" height="250" rx="12" fill="url(#bgGradient)" />

  <!-- Play Button Circle -->
  <circle cx="200" cy="125" r="40" fill="rgba(255,255,255,0.1)" />

  <!-- Play Icon -->
  <polygon points="185,105 185,145 225,125" fill="#ffffff" />

  <!-- Subtle Border -->
  <rect x="1" y="1" width="398" height="248" rx="12" fill="none" stroke="#374151" strokeWidth="2"/>
</svg>